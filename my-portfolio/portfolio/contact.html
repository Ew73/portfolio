<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="utf-8" />

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="style.css" />
</head>
<body>
    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-success">
        <div class="container">
            <a class="navbar-brand" href="index.html">Mon Portfolio</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
                aria-controls="navbarNav" aria-expanded="false" aria-label="Basculer la navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="index.html">Accueil🏠</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="projets.html">Projets💻</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="about.html">À propos🙌</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active" aria-current="page" href="contact.html">Contact📞</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

 <!-- Header -->
    <header class="text-black text-center py-5">
        <div class="container">
            <h1 class="display-4">Contactez-moi</h1>
            <p class="lead">N'hésitez pas à m'envoyer un message pour toute question ou collaboration !</p>
        </div>

        <!-- liens vers les réseaux sociaux -->
        <div class="container mt-4">
            <div class="row justify-content-center">
                <div class="col-auto">
                    <a href="https://www.linkedin.com/in/ewen-pernoud-02566839a/" target="_blank" class="btn btn-outline-primary">LinkedIn</a>
                </div>
                <div class="col-auto">
                    <a href="https://github.com/repos?q=owner%3A%40me" target="_blank" class="btn btn-outline-primary">GitHub</a>
                </div>
            </div>
        </div>
    </header>

    <!-- Formulaire de contact -->
    <section class="py-5">
        <div class="container">
           <div class="row align-items-center">
            <!-- Image -->
            <div class="col-md-6 mb-4 mb-md-0">
                <img src="ghostedvpn-hacker-cat.gif" alt="Illustration contact" class="img-fluid rounded shadow">
            </div>
           <div class="col-md-6">
                <form
                    action="https://formspree.io/f/xkoprkej"
                    method="POST"
                    >
                    <div class="mb-3">
                        <label for="nom" class="form-label">Nom</label>
                        <input type="text" class="form-control" id="nom" name="nom" placeholder="Votre nom" required>
                    </div>
                    <div class="mb-3">
                        <label for="email" class="form-label">Adresse email</label>
                        <input type="email" class="form-control" id="email" name="email" placeholder="votremail@example.com" required>
                    </div>
                    <div class="mb-3">
                        <label for="message" class="form-label">Message</label>
                        <textarea class="form-control" id="message" name="message" rows="5" placeholder="Votre message ici..." required></textarea>
                    </div>
                        <button type="submit" class="btn btn-primary">Envoyer</button>
                    </form>
                </div>
            </div>
        </div>
    </section>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
